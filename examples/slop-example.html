<!doctype html>
<html><head><meta charset="utf-8"><title>Habit Tracker</title>
<style>
/* Illustrative only: a hand-written sample of the defaults an AI agent tends to produce. Used to show what the linter catches. */
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#0b0b1a;color:#fff}
.hero{padding:56px 40px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);text-align:center}
.hero h1{margin:0 0 8px;font-size:40px}.hero p{margin:0;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:32px 40px}
.card{background:#16162b;border-radius:16px;padding:20px;border-left:4px solid #6366f1;box-shadow:0 0 30px rgba(99,102,241,.35)}
.card h3{margin:0 0 6px;font-size:18px}.card small{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#888}
.pill{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:#22ff88;color:#000;font-size:12px}
</style></head><body>
<div class="hero"><h1>🚀 Build better habits</h1><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p></div>
<div class="grid">
<div class="card"><small>Daily</small><h3>💧 Drink water</h3><p>John Doe completed 100% of this habit.</p><span class="pill">100%</span></div>
<div class="card"><small>Weekly</small><h3>🏃 Run</h3><p>Lorem ipsum dolor sit amet.</p><span class="pill">50%</span></div>
<div class="card"><small>Daily</small><h3>📚 Read</h3><p>Sed do eiusmod tempor incididunt.</p><span class="pill">100%</span></div>
</div></body></html>
